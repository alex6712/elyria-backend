[project]
name = "elyria-backend"
version = "0.5.1"
description = "Романтичное приложение-подарок на 14 февраля от Лёши для Светы."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "redis>=8.0.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "basedpyright>=1.39.9",
    "import-linter>=2.13",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "types-aiobotocore>=3.8.0",
    "types-aiobotocore-s3>=3.8.0",
]

[tool.pytest.ini_options]
addopts = "-ra -q --cov=src --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
markers = [
    "integration: тесты, требующие реальных PostgreSQL и Redis (make services)",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["./alembic/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "W", "B", "SIM", "ARG", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "users-clean-architecture"
type = "layers"
layers = [
    "src.users.composition",
    "src.users.presentation",
    "src.users.infrastructure",
    "src.users.application",
    "src.users.domain",
]

[[tool.importlinter.contracts]]
name = "shared-clean-architecture"
type = "layers"
layers = [
    "src.shared.presentation",
    "src.shared.infrastructure",
    "src.shared.domain",
]

[[tool.importlinter.contracts]]
name = "domain-does-not-depend-on-infrastructure"
type = "forbidden"
source_modules = ["src.users.domain", "src.shared.domain"]
forbidden_modules = ["src.shared.infrastructure", "src.shared.presentation"]

[[tool.importlinter.contracts]]
name = "application-does-not-depend-on-infrastructure"
type = "forbidden"
source_modules = ["src.users.application"]
forbidden_modules = ["src.shared.infrastructure", "src.shared.presentation"]

[[tool.importlinter.contracts]]
name = "shared-does-not-depend-on-bounded-contexts"
type = "forbidden"
source_modules = ["src.shared"]
forbidden_modules = ["src.users", "src.composition"]

[[tool.importlinter.contracts]]
name = "users-does-not-depend-on-composition"
type = "forbidden"
source_modules = [
    "src.users.domain",
    "src.users.application",
    "src.users.infrastructure",
    "src.users.presentation",
    "src.users.composition",
]
forbidden_modules = ["src.composition"]
